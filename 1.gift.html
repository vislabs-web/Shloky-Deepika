<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#dcecff">
  <title>Gift 01 — A Little Song</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"DM Sans",sans-serif;color:#263243}
    body{background:linear-gradient(#dcecff 0 42%,#bfd5bd 42% 100%);padding:30px 18px 50px}
    .page{min-height:calc(100vh - 80px);display:grid;place-items:center}
    .paper{width:min(650px,94vw);padding:65px 30px 45px;text-align:center;background:#fffdf8;position:relative;box-shadow:12px 18px 0 rgba(67,79,92,.12),0 20px 42px rgba(52,70,92,.13);clip-path:polygon(1% 2%,98% 0,100% 97%,3% 100%,0 10%)}
    .tape{position:absolute;width:105px;height:30px;background:rgba(239,218,164,.78);top:17px;left:50%;transform:translateX(-50%) rotate(-2deg)}
    .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#718095;margin:0 0 15px}
    h1{font:600 clamp(48px,8vw,72px)/.9 "Cormorant Garamond",serif;margin:0}
    .subtitle{font:18px "Cormorant Garamond",serif;color:#6d7888;margin:18px 0 28px}
    .player{background:#eef4fa;padding:25px 20px;box-shadow:5px 7px 0 rgba(67,79,92,.1)}
    .disc{width:105px;height:105px;border-radius:50%;margin:0 auto 20px;background:repeating-radial-gradient(circle,#263243 0 2px,#101821 3px 5px);box-shadow:0 7px 0 #aeb8c4;display:grid;place-items:center}
    .disc:after{content:"♪";width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fffdf8;color:#263243;font-size:18px}
    audio{width:100%;max-width:450px}
    .note{font:18px "Cormorant Garamond",serif;color:#657184;margin:24px 0 28px}
    .back{display:inline-block;color:#fff;text-decoration:none;background:#263243;padding:13px 20px;border-radius:999px;box-shadow:0 5px 0 #aeb8c4;font-size:13px;font-weight:600}
    .back:active{transform:translateY(2px);box-shadow:0 3px 0 #aeb8c4}
    @media(max-width:500px){body{padding:18px 12px 35px}.paper{padding:58px 18px 38px}.player{padding:22px 12px}.subtitle{font-size:17px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="paper">
      <div class="tape"></div>
      <p class="eyebrow">Gift 01 · Just for you</p>
      <h1>A little song ♡</h1>
      <p class="subtitle">I picked this one especially for you, Deepika.</p>

      <div class="player">
        <div class="disc" aria-hidden="true"></div>
        <audio controls preload="metadata">
          <source src="assets/music.mp3" type="audio/mpeg">
          Your browser does not support audio playback.
        </audio>
      </div>

      <p class="note">Put on your headphones and enjoy. ♡</p>
      <a class="back" href="index.html">← Go back to home page</a>
    </section>
  </main>
</body>
</html>
